<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="SURF feature detection and matching">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="0.55" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#090a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7c8cff"/>
    </marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#4fd1c5"/>
    </marker>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
      .h{fill:#f2f4fa;font-size:24px;font-weight:700}
      .s{fill:#98a1bd;font-size:13px}
      .nt{fill:#eef0f6;font-size:15px;font-weight:600}
      .ns{fill:#98a1bd;font-size:11px}
      .ft{fill:#c9d0e6;font-size:12.5px}
      .n{fill:url(#node);stroke:rgba(255,255,255,0.16);stroke-width:1.4}
      .chip{fill:rgba(255,255,255,0.045);stroke:rgba(255,255,255,0.12);stroke-width:1.2}
      .fl{stroke:#7c8cff;stroke-width:1.8;fill:none}
      .frame{fill:rgba(255,255,255,0.04);stroke:rgba(255,255,255,0.16);stroke-width:1.3}
      .kp{fill:none;stroke:#4fd1c5;stroke-width:1.6}
      .kpc{fill:#4fd1c5}
      .mt{stroke:#f5a97f;stroke-width:1.4;fill:none;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <text class="h" x="40" y="58">SURF Feature Matching</text>
  <text class="s" x="40" y="84">Speeded-Up Robust Features &#183; OpenCV &#183; NumPy</text>
  <rect class="chip" x="642" y="36" width="118" height="30" rx="15"/>
  <text class="ns" x="701" y="55" text-anchor="middle">64-d descriptors</text>

  <rect class="n" x="40" y="128" width="160" height="80" rx="14"/>
  <text class="nt" x="58" y="162">Image Pair</text>
  <text class="ns" x="58" y="184">query + scene</text>

  <rect class="n" x="218" y="128" width="160" height="80" rx="14"/>
  <text class="nt" x="236" y="162">Integral Image</text>
  <text class="ns" x="236" y="184">Hessian box filters</text>

  <rect class="n" x="396" y="128" width="160" height="80" rx="14"/>
  <text class="nt" x="414" y="162">Keypoints</text>
  <text class="ns" x="414" y="184">oriented descriptors</text>

  <rect class="n" x="574" y="128" width="160" height="80" rx="14"/>
  <text class="nt" x="592" y="162">Descriptor Match</text>
  <text class="ns" x="592" y="184">RANSAC filtering</text>

  <path class="fl" d="M204 168H214" marker-end="url(#ar)"/>
  <path class="fl" d="M382 168H392" marker-end="url(#ar)"/>
  <path class="fl" d="M560 168H570" marker-end="url(#ar)"/>

  <rect class="frame" x="60" y="258" width="270" height="140" rx="10"/>
  <text class="ns" x="74" y="282">query image</text>
  <circle class="kp" cx="120" cy="316" r="9"/>
  <circle class="kpc" cx="120" cy="316" r="3"/>
  <circle class="kp" cx="200" cy="350" r="9"/>
  <circle class="kpc" cx="200" cy="350" r="3"/>
  <circle class="kp" cx="264" cy="304" r="9"/>
  <circle class="kpc" cx="264" cy="304" r="3"/>
  <circle class="kp" cx="150" cy="372" r="9"/>
  <circle class="kpc" cx="150" cy="372" r="3"/>

  <rect class="frame" x="470" y="258" width="270" height="140" rx="10"/>
  <text class="ns" x="484" y="282">scene image</text>
  <circle class="kp" cx="530" cy="322" r="9"/>
  <circle class="kpc" cx="530" cy="322" r="3"/>
  <circle class="kp" cx="612" cy="356" r="9"/>
  <circle class="kpc" cx="612" cy="356" r="3"/>
  <circle class="kp" cx="676" cy="310" r="9"/>
  <circle class="kpc" cx="676" cy="310" r="3"/>
  <circle class="kp" cx="560" cy="378" r="9"/>
  <circle class="kpc" cx="560" cy="378" r="3"/>

  <path class="mt" d="M130 316L520 322" marker-end="url(#art)"/>
  <path class="mt" d="M210 350L602 356" marker-end="url(#art)"/>
  <path class="mt" d="M274 304L666 310" marker-end="url(#art)"/>

  <text class="ns" x="400" y="422" text-anchor="middle">keypoint correspondences</text>

  <rect class="chip" x="40" y="444" width="176" height="38" rx="19"/>
  <text class="ft" x="58" y="468">Object recognition</text>
  <rect class="chip" x="236" y="444" width="150" height="38" rx="19"/>
  <text class="ft" x="254" y="468">Image stitching</text>
  <rect class="chip" x="406" y="444" width="176" height="38" rx="19"/>
  <text class="ft" x="424" y="468">Scale invariant</text>
</svg>