<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Agent evaluation and benchmarking pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="0.55" stop-color="#111436"/>
      <stop offset="1" stop-color="#090a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7c8cff"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#f5a97f"/>
    </marker>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
      .h{fill:#f2f4fa;font-size:24px;font-weight:700}
      .s{fill:#98a1bd;font-size:13px}
      .nt{fill:#eef0f6;font-size:15px;font-weight:600}
      .ns{fill:#98a1bd;font-size:11px}
      .ft{fill:#c9d0e6;font-size:12.5px}
      .lbl{fill:#f5a97f;font-size:11.5px}
      .n{fill:url(#node);stroke:rgba(255,255,255,0.16);stroke-width:1.4}
      .chip{fill:rgba(255,255,255,0.045);stroke:rgba(255,255,255,0.12);stroke-width:1.2}
      .fl{stroke:#7c8cff;stroke-width:1.8;fill:none}
      .bus{stroke:#7c8cff;stroke-opacity:0.55;stroke-width:1.6;fill:none}
      .dash{stroke:#f5a97f;stroke-width:1.6;fill:none;stroke-dasharray:6 6}
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <text class="h" x="40" y="58">Agent Evaluation &amp; Benchmarking</text>
  <text class="s" x="40" y="84">ReAct &#183; Plan-and-Execute &#183; LangGraph vs CrewAI vs AutoGen</text>
  <rect class="chip" x="642" y="36" width="118" height="30" rx="15"/>
  <text class="ns" x="701" y="55" text-anchor="middle">GAIA-style set</text>

  <rect class="n" x="40" y="140" width="200" height="86" rx="14"/>
  <text class="nt" x="60" y="178">100+ Test Cases</text>
  <text class="ns" x="60" y="200">custom + GAIA-style</text>

  <rect class="n" x="280" y="140" width="200" height="86" rx="14"/>
  <text class="nt" x="300" y="178">Agent Under Test</text>
  <text class="ns" x="300" y="200">ReAct &#183; Plan-Execute</text>

  <rect class="n" x="520" y="140" width="200" height="86" rx="14"/>
  <text class="nt" x="540" y="178">Evaluation Harness</text>
  <text class="ns" x="540" y="200">auto-run + scoring</text>

  <path class="fl" d="M244 183H276" marker-end="url(#ar)"/>
  <path class="fl" d="M484 183H516" marker-end="url(#ar)"/>

  <path class="dash" d="M620 138C620 96 380 96 380 138" marker-end="url(#arw)"/>
  <text class="lbl" x="500" y="88" text-anchor="middle">reflection loop</text>

  <path class="bus" d="M620 230V262"/>
  <path class="bus" d="M122 262H660"/>
  <path class="bus" d="M122 262V284" marker-end="url(#ar)"/>
  <path class="bus" d="M301 262V284" marker-end="url(#ar)"/>
  <path class="bus" d="M480 262V284" marker-end="url(#ar)"/>
  <path class="bus" d="M659 262V284" marker-end="url(#ar)"/>

  <rect class="chip" x="40" y="288" width="165" height="64" rx="12"/>
  <text class="nt" x="56" y="318">Success Rate</text>
  <text class="ns" x="56" y="338">% tasks solved</text>

  <rect class="chip" x="219" y="288" width="165" height="64" rx="12"/>
  <text class="nt" x="235" y="318">Token Use</text>
  <text class="ns" x="235" y="338">cost per task</text>

  <rect class="chip" x="398" y="288" width="165" height="64" rx="12"/>
  <text class="nt" x="414" y="318">Error Recovery</text>
  <text class="ns" x="414" y="338">retry success</text>

  <rect class="chip" x="577" y="288" width="165" height="64" rx="12"/>
  <text class="nt" x="593" y="318">Latency</text>
  <text class="ns" x="593" y="338">p50 and p95</text>

  <rect class="chip" x="40" y="394" width="190" height="38" rx="19"/>
  <text class="ft" x="58" y="418">Automated harness</text>
  <rect class="chip" x="242" y="394" width="160" height="38" rx="19"/>
  <text class="ft" x="260" y="418">Reflection loops</text>
  <rect class="chip" x="414" y="394" width="188" height="38" rx="19"/>
  <text class="ft" x="432" y="418">Framework compare</text>

  <text class="ns" x="40" y="466">Leaderboard + failure analysis across 100+ cases</text>
</svg>