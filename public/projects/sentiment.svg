<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Sentiment analysis pipeline for web blogs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="0.55" stop-color="#161033"/>
      <stop offset="1" stop-color="#090a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#8b9bff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8b9bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7c8cff"/>
    </marker>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
      .h{fill:#f2f4fa;font-size:24px;font-weight:700}
      .s{fill:#98a1bd;font-size:13px}
      .nt{fill:#eef0f6;font-size:15px;font-weight:600}
      .ns{fill:#98a1bd;font-size:11px}
      .ft{fill:#c9d0e6;font-size:12.5px}
      .pos{fill:#7ee2b8;font-size:14px;font-weight:600}
      .neg{fill:#ff9c9c;font-size:14px;font-weight:600}
      .neu{fill:#c3cbe3;font-size:14px;font-weight:600}
      .n{fill:url(#node);stroke:rgba(255,255,255,0.16);stroke-width:1.4}
      .chip{fill:rgba(255,255,255,0.045);stroke:rgba(255,255,255,0.12);stroke-width:1.2}
      .fl{stroke:#7c8cff;stroke-width:1.8;fill:none}
      .bus{stroke:#7c8cff;stroke-opacity:0.55;stroke-width:1.6;fill:none}
      .barpos{fill:#7ee2b8}
      .barneg{fill:#ff9c9c}
      .barneu{fill:#c3cbe3}
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <text class="h" x="40" y="58">Sentiment Analysis of Blogs</text>
  <text class="s" x="40" y="84">BeautifulSoup &#183; NLTK &#183; from-scratch classifier</text>
  <rect class="chip" x="642" y="36" width="118" height="30" rx="15"/>
  <text class="ns" x="701" y="55" text-anchor="middle">150+ posts</text>

  <rect class="n" x="40" y="128" width="160" height="80" rx="14"/>
  <text class="nt" x="58" y="162">Blog Corpus</text>
  <text class="ns" x="58" y="184">150+ posts</text>

  <rect class="n" x="218" y="128" width="160" height="80" rx="14"/>
  <text class="nt" x="236" y="162">Scrape + Clean</text>
  <text class="ns" x="236" y="184">BeautifulSoup</text>

  <rect class="n" x="396" y="128" width="160" height="80" rx="14"/>
  <text class="nt" x="414" y="162">NLP Preprocess</text>
  <text class="ns" x="414" y="184">tokens, stopwords</text>

  <rect class="n" x="574" y="128" width="160" height="80" rx="14"/>
  <text class="nt" x="592" y="162">Classifier</text>
  <text class="ns" x="592" y="184">built from scratch</text>

  <path class="fl" d="M204 168H214" marker-end="url(#ar)"/>
  <path class="fl" d="M382 168H392" marker-end="url(#ar)"/>
  <path class="fl" d="M560 168H570" marker-end="url(#ar)"/>

  <path class="bus" d="M654 212V248"/>
  <path class="bus" d="M122 248H660"/>
  <path class="bus" d="M122 248V272" marker-end="url(#ar)"/>
  <path class="bus" d="M301 248V272" marker-end="url(#ar)"/>
  <path class="bus" d="M480 248V272" marker-end="url(#ar)"/>
  <path class="bus" d="M659 248V272" marker-end="url(#ar)"/>

  <rect class="chip" x="40" y="276" width="165" height="62" rx="12"/>
  <text class="pos" x="56" y="306">Positive</text>
  <rect class="barpos" x="56" y="316" width="96" height="6" rx="3"/>

  <rect class="chip" x="219" y="276" width="165" height="62" rx="12"/>
  <text class="neu" x="235" y="306">Neutral</text>
  <rect class="barneu" x="235" y="316" width="62" height="6" rx="3"/>

  <rect class="chip" x="398" y="276" width="165" height="62" rx="12"/>
  <text class="neg" x="414" y="306">Negative</text>
  <rect class="barneg" x="414" y="316" width="44" height="6" rx="3"/>

  <rect class="chip" x="577" y="276" width="165" height="62" rx="12"/>
  <text class="nt" x="593" y="304">Benchmark</text>
  <text class="ns" x="593" y="324">vs NLTK baseline</text>

  <text class="ns" x="40" y="378">Custom scoring logic compared against NLTK's built-in sentiment analyser</text>

  <rect class="chip" x="40" y="444" width="170" height="38" rx="19"/>
  <text class="ft" x="58" y="468">Web scraping</text>
  <rect class="chip" x="230" y="444" width="150" height="38" rx="19"/>
  <text class="ft" x="248" y="468">NLTK pipeline</text>
  <rect class="chip" x="400" y="444" width="180" height="38" rx="19"/>
  <text class="ft" x="418" y="468">Model comparison</text>
</svg>