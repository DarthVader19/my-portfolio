<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Multimodal Telegram RAG bot flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="0.55" stop-color="#111436"/>
      <stop offset="1" stop-color="#090a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#2aabee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2aabee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2aabee"/>
    </marker>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
      .h{fill:#f2f4fa;font-size:24px;font-weight:700}
      .s{fill:#98a1bd;font-size:13px}
      .nt{fill:#eef0f6;font-size:15px;font-weight:600}
      .ns{fill:#98a1bd;font-size:11px}
      .ft{fill:#c9d0e6;font-size:12.5px}
      .msg{fill:#eaf0ff;font-size:13px}
      .cite{fill:#7fd4f7;font-size:12px}
      .n{fill:url(#node);stroke:rgba(255,255,255,0.16);stroke-width:1.4}
      .chip{fill:rgba(255,255,255,0.045);stroke:rgba(255,255,255,0.12);stroke-width:1.2}
      .bus{stroke:#2aabee;stroke-opacity:0.6;stroke-width:1.6;fill:none}
      .ask{fill:rgba(42,171,238,0.16);stroke:rgba(42,171,238,0.4);stroke-width:1.2}
      .ans{fill:rgba(255,255,255,0.05);stroke:rgba(255,255,255,0.14);stroke-width:1.2}
      .tag{fill:#7fd4f7;font-size:11px}
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <text class="h" x="40" y="58">Multimodal Telegram RAG Bot</text>
  <text class="s" x="40" y="84">Telegram Bot API &#183; ChromaDB &#183; BLIP &#183; Mistral</text>
  <rect class="chip" x="642" y="36" width="118" height="30" rx="15"/>
  <text class="ns" x="701" y="55" text-anchor="middle">text + image</text>

  <rect class="n" x="40" y="120" width="170" height="76" rx="14"/>
  <text class="nt" x="60" y="152">Telegram</text>
  <text class="ns" x="60" y="174">text &#183; photo</text>

  <rect class="n" x="248" y="120" width="170" height="76" rx="14"/>
  <text class="nt" x="268" y="152">Bot Handlers</text>
  <text class="ns" x="268" y="174">commands + cache</text>

  <rect class="n" x="520" y="96" width="240" height="56" rx="12"/>
  <text class="nt" x="540" y="120">ChromaDB Retrieval</text>
  <text class="ns" x="540" y="140">top-k chunks</text>

  <rect class="n" x="520" y="180" width="240" height="56" rx="12"/>
  <text class="nt" x="540" y="204">BLIP Caption</text>
  <text class="ns" x="540" y="224">tags + keywords</text>

  <rect class="n" x="520" y="264" width="240" height="56" rx="12"/>
  <text class="nt" x="540" y="288">LLM Answer</text>
  <text class="ns" x="540" y="308">grounded + cited</text>

  <path class="bus" d="M418 158H480"/>
  <path class="bus" d="M480 124V292"/>
  <path class="bus" d="M480 124H516" marker-end="url(#ar)"/>
  <path class="bus" d="M480 208H516" marker-end="url(#ar)"/>
  <path class="bus" d="M480 292H516" marker-end="url(#ar)"/>
  <text class="tag" x="449" y="150" text-anchor="middle">route</text>

  <rect class="ask" x="40" y="222" width="380" height="54" rx="16"/>
  <text class="msg" x="60" y="254">Summarise the report and describe the photo</text>

  <rect class="ans" x="40" y="298" width="470" height="84" rx="16"/>
  <text class="msg" x="60" y="330">Section 2 covers rollout risks and mitigations.</text>
  <text class="msg" x="60" y="352">Image: latency dashboard, spike at 14:00.</text>
  <text class="cite" x="60" y="372">[1] report.pdf  &#183;  [2] arch.png</text>

  <text class="ns" x="400" y="408" text-anchor="middle">one conversation context shared by retrieval and vision</text>

  <rect class="chip" x="40" y="430" width="170" height="38" rx="19"/>
  <text class="ft" x="58" y="454">Telegram Bot API</text>
  <rect class="chip" x="228" y="430" width="150" height="38" rx="19"/>
  <text class="ft" x="246" y="454">ChromaDB</text>
  <rect class="chip" x="396" y="430" width="150" height="38" rx="19"/>
  <text class="ft" x="414" y="454">BLIP vision</text>
  <rect class="chip" x="564" y="430" width="196" height="38" rx="19"/>
  <text class="ft" x="582" y="454">Conversation memory</text>
</svg>
